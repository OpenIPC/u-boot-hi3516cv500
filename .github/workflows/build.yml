name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        soc: [hi3516cv500, hi3516dv300, hi3516av300]

    steps:
      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g:i386 libc6:i386 libstdc++6:i386

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: arm-himix100-linux-v1

      - name: Download toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -R OpenIPC/toolchains \
            -p 'arm-himix100-linux.tgz'
          mkdir -p toolchain
          tar xzf arm-himix100-linux.tgz -C toolchain
          if [ -f toolchain/arm-himix100-linux/arm-himix100-linux.tar.bz2 ]; then
            tar xjf toolchain/arm-himix100-linux/arm-himix100-linux.tar.bz2 \
                -C toolchain
          fi
          rm arm-himix100-linux.tgz
          ls toolchain/arm-himix100-linux/bin/arm-himix100-linux-gcc

      - name: Build
        run: |
          export PATH="$PWD/toolchain/arm-himix100-linux/bin:$PATH"
          make clean
          # Kbuild-style: defconfig comes from configs/<soc>_smp_defconfig
          # and the register init blob has a different naming convention
          # in this repo (`reginfo-` not `reg_info_`).
          make CROSS_COMPILE=arm-himix100-linux- ${{ matrix.soc }}_smp_defconfig
          cp reginfo-${{ matrix.soc }}.bin .reg
          make CROSS_COMPILE=arm-himix100-linux- -j$(nproc)
          if [ ! -f tools/hi_gzip/bin/gzip ]; then
            # tools/hi_gzip's Makefile uses bash builtins (popd); on
            # Ubuntu /bin/sh is dash, so invoke make with SHELL=bash.
            make -C tools/hi_gzip SHELL=/bin/bash
          fi
          cp -rf tools/hi_gzip/bin/gzip \
            arch/arm/cpu/armv7/${{ matrix.soc }}/hw_compressed/
          make CROSS_COMPILE=arm-himix100-linux- u-boot-z.bin
          cp u-boot-${{ matrix.soc }}.bin u-boot-${{ matrix.soc }}-universal.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}-universal
          path: u-boot-${{ matrix.soc }}-universal.bin

  qemu_smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # hi3516dv300 has no QEMU machine in widgetii/qemu-hisilicon,
        # so we can't smoke-test it. cv500 and av300 both have machines
        # and Cortex-A7 CPUs.
        include:
          - { soc: hi3516cv500, machine: hi3516cv500 }
          - { soc: hi3516av300, machine: hi3516av300 }
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Resolve qemu-hisilicon HEAD
        id: qemu-rev
        run: |
          sha=$(git ls-remote https://github.com/widgetii/qemu-hisilicon master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache qemu-system-arm
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: qemu-arm
          key: qemu-hisilicon-${{ steps.qemu-rev.outputs.sha }}

      - name: Build qemu-system-arm (cache miss)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch master \
            https://github.com/widgetii/qemu-hisilicon qemu-hisilicon
          cd qemu-hisilicon
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}-universal

      - name: Smoke-test in QEMU
        timeout-minutes: 2
        run: |
          UBOOT="$PWD/u-boot-${{ matrix.soc }}-universal.bin"
          test -f "$UBOOT"
          dd if=/dev/zero of=/tmp/flash.bin bs=1M count=8 2>/dev/null
          dd if="$UBOOT" of=/tmp/flash.bin bs=1 conv=notrunc 2>/dev/null
          mkfifo /tmp/uart.in /tmp/uart.out
          chmod +x ./qemu-arm
          ./qemu-arm \
            -M ${{ matrix.machine }} \
            -global hisi-fmc.flash-file=/tmp/flash.bin \
            -nographic -serial pipe:/tmp/uart \
            -monitor none > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          timeout 10 cat /tmp/uart.out > /tmp/uboot.txt || true
          kill "$QEMU_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          echo "== captured u-boot output =="
          cat /tmp/uboot.txt
          echo
          if grep -qE 'U-Boot |Hit any key|CPU:|DRAM:|Board:' /tmp/uboot.txt; then
            echo "PASS: u-boot booted past System startup"
          else
            echo "FAIL: u-boot did not get past System startup"
            tail -40 /tmp/qemu.log || true
            exit 1
          fi

  publish:
    needs: [build, qemu_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          for soc in hi3516cv500 hi3516dv300 hi3516av300; do
            f="artifacts/u-boot-${soc}-universal/u-boot-${soc}-universal.bin"
            test -f "$f"
            upload "$f"
          done
